name: release

on:
  push:
    tags:
      - v*

jobs:
  create-release:
    name: Create release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # TODO : --prerelease if tag contains "rc"
      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" --title "Release ${{ github.ref_name }}" --draft=false --prerelease=false

  build-msys-mingw64:
    name: Build and package for Windows
    needs: create-release
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout sources
        uses: actions/checkout@v5

      - name: Setup msys2 dependencies
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: git zip mingw-w64-x86_64-cc mingw-w64-x86_64-rust mingw-w64-x86_64-zeromq mingw-w64-x86_64-pkg-config

      - name: Run cargo check
        run: cargo check --release

      - name: Build
        run: cargo build --bin battle_gui --bin battle_server --bin oc_launcher --release

      - name: Package
        run: tools/package_release_windows.sh ${{ github.ref_name }}

      - name: Upload artifact
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" "OpenCombat_${{ github.ref_name }}_Win64.zip" --clobber

  build-linux:
    name: Build and package for Linux
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v5

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install OS dependencies
        uses: ./.github/actions/setup

      - name: Run cargo check
        run: cargo check --release

      - name: Build
        run: cargo build --bin battle_gui --bin battle_server --bin oc_launcher --release

      - name: Package
        run: tools/package_release_linux.sh ${{ github.ref_name }}

      - name: Upload artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" "OpenCombat_${{ github.ref_name }}_Linux.zip" --clobber
