on:
  pull_request:

name: Continuous integration

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  gate:
    name: ${{ matrix.gate.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        gate:
          - name: Clippy
            components: clippy
            all-targets: true
            run: cargo clippy --workspace --all-targets --keep-going --locked -- -D warnings
          - name: Test suite
            components: ""
            all-targets: false
            run: cargo test --workspace --locked
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: ${{ matrix.gate.components }}
      - uses: Swatinem/rust-cache@v2
        with:
          cache-all-targets: ${{ matrix.gate.all-targets }}
      - run: ${{ matrix.gate.run }}

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
        with:
          cache-all-targets: true
      - run: cargo llvm-cov --workspace --locked --summary-only
